<!DOCTYPE html>
<html lang="th">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="แอปพลิเคชันวางแผนเส้นทางวิ่งและประเมินความปลอดภัย (Running Route Finder)">
  <meta name="theme-color" content="#FC4C02">

  <!-- Google Sign-In Web Client ID (เว้นค่าว่างไว้สำหรับใส่ Web Client ID จาก Google Cloud Console) -->
  <meta name="google-signin-client_id" content="">

  <!-- iOS PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Running Finder">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Running Finder — แอปวางแผนเส้นทางวิ่ง</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0D0D0D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 40%, #1A1A1A 0%, #0D0D0D 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .logo-container {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #FC4C02;
      border-right-color: #FC4C02;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    .logo-img {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(252, 76, 2, 0.35);
    }
    .app-title {
      margin-top: 24px;
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .app-subtitle {
      margin-top: 6px;
      color: #8C8C8C;
      font-size: 13px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-container">
      <div class="logo-ring"></div>
      <img src="icons/Icon-192.png" alt="Running Finder" class="logo-img">
    </div>
    <div class="app-title">Running Finder</div>
    <div class="app-subtitle">กำลังโหลดแอปพลิเคชัน...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          splash.remove();
        }, 400);
      }
    });
  </script>

  <!-- ฝัง bootstrap ไว้ใน index.html (no-cache) แทนไฟล์แยกที่ browser อาจ cache ไว้ -->
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
